---
name: nanogpt-provider
version: 0.4.3
description: "NanoGPT model provider"
author: Daya Adianto
kind: model-provider
requires_env:
  - name: NANOGPT_API_KEY
    description: "NanoGPT API key"
    url: https://nano-gpt.com/api
    secret: true
  - name: NANOGPT_MODEL_LIST_ENDPOINT
    description: "NanoGPT model list endpoint (canonical, personalized, subscription, paid). Optional, defaults to canonical."
    secret: false
