[project]
name = "hermes-nanogpt-provider"
version = "0.4.2"
description = "Hermes Agent plugin for NanoGPT as model provider."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Daya Adianto", email = "addianto@users.noreply.github.com" },
]
maintainers = [
    { name = "Daya Adianto", email = "addianto@users.noreply.github.com" },
]
keywords = [
    "hermes-agent",
    "nanogpt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/addianto/hermes-nanogpt-provider"
Repository = "https://github.com/addianto/hermes-nanogpt-provider"
Issues = "https://github.com/addianto/hermes-nanogpt-provider/issues"

[project.entry-points."hermes_agent.plugins"]
nanogpt-provider = "hermes_nanogpt_provider"

[build-system]
requires = ["uv_build>=0.12.23"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hermes-agent>=0.19.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
]

[pytest]
addopts = ["--import-mode=importlib"]
