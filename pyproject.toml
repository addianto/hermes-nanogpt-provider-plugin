[project]
name = "nanogpt-model-provider-hermes-plugin"
version = "0.3.0"
description = "Hermes Agent plugin for NanoGPT as model provider."
authors = [
    { name = "Daya Adianto", email = "addianto@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.entry-points."hermes_agent.plugins"]
nanogpt-provider = "nanogpt_model_provider_hermes_plugin:register"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hermes-agent>=0.17.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[pytest]
addopts = ["--import-mode=importlib"]
