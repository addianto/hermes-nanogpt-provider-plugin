[project]
name = "hermes-nanogpt-provider"
version = "0.4.6"
description = "Hermes Agent plugin for NanoGPT as model provider."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
authors = [
    { name = "Daya Adianto", email = "addianto@users.noreply.github.com" },
]
maintainers = [
    { name = "Daya Adianto", email = "addianto@users.noreply.github.com" },
]
keywords = [
    "hermes-agent",
    "nanogpt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/addianto/hermes-nanogpt-provider-plugin"
Repository = "https://github.com/addianto/hermes-nanogpt-provider-plugin"
Issues = "https://github.com/addianto/hermes-nanogpt-provider-plugin/issues"

[project.entry-points."hermes_agent.plugins"]
nanogpt-provider = "hermes_nanogpt_provider:register"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[pytest]
addopts = ["--import-mode=importlib"]
