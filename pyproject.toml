[project]
name = "hermes-nanogpt-provider"
version = "0.4.0"
description = "Hermes Agent plugin for NanoGPT as model provider."
authors = [
    { name = "Daya Adianto", email = "addianto@users.noreply.github.com" }
]
requires-python = ">=3.11"

[project.entry-points."hermes_agent.plugins"]
nanogpt-provider = "hermes_nanogpt_provider:register"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hermes-agent>=0.17.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
]

[pytest]
addopts = ["--import-mode=importlib"]
