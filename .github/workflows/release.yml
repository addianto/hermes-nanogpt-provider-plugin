---
name: PyPI

on:
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-nanogpt-provider

    steps:
      - name: Download release assets
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # No need to generate the attestations because they already included from the staging workflow
          attestations: false
          packages-dir: dist/
