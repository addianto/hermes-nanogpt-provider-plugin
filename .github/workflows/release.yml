---
name: PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g., v0.4.7)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-nanogpt-provider

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: "auto"

      - name: Build package distributions
        run: uv build

      - name: Check package metadata & README
        run: uvx twine check --strict dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          packages-dir: dist/
          print-hash: true

      - name: Upload assets to draft release
        run: |
          gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}

      - name: Publish release
        run: |
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
