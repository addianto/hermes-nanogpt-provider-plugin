---
name: PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g., v0.4.7)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-nanogpt-provider

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: "auto"

      - name: Build package distributions
        run: uv build

      - name: Check package metadata & README
        run: uvx twine check --strict dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          attestations: true
          packages-dir: dist/
          print-hash: true

      - name: Upload assets to draft release
        run: |
          gh release upload "${{ inputs.tag }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: |
          gh release edit "${{ inputs.tag }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
