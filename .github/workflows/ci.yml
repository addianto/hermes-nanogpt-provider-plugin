---
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
    contents: read

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.project-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: "auto"
          prune-cache: "true"

      - name: Check stale lockfile
        run: uv lock --check

      - name: Install dev dependencies
        run: |
          uv venv
          uv pip install -r requirements-dev.txt

      - name: Run Ruff check
        run: |
          mkdir -p reports
          uv run --no-build --frozen ruff check \
            --output-format sarif | tee reports/ruff-check.json
          uv run --no-build --frozen ruff format --check \
            --output-format sarif | tee reports/ruff-format.json

      - name: Run Pytest and measure coverage
        run: |
          mkdir -p reports
          uv run --no-build --frozen pytest \
            --cov=src --cov-report=term-missing \
            --junit-xml=reports/junit.xml \
            --cov-report xml:reports/coverage.xml \
            --cov-report markdown-append:$GITHUB_STEP_SUMMARY

      - name: Get project version
        id: project-version
        run: |
          VERSION="$(uv version --short --frozen)"
          echo "Project version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports
          path: reports/
          if-no-files-found: error
          retention-days: 7

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-24.04
    needs:
      - ci
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download reports
        uses: actions/download-artifact@v8.0.2
        with:
          name: reports
          path: reports/

      - name: Authenticate to SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >
            -Dsonar.projectVersion=${{ needs.ci.outputs.version }}

  integration-test:
    name: Integration Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        hermes-version: ["v2026.7.20", "v0.23.2"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check if manual plugin installation works in Hermes Agent container
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD":/workspace:ro \
            docker.io/nousresearch/hermes-agent:${{ matrix.hermes-version }} \
            -c '
              set -euo pipefail
              mkdir -p /opt/data/plugins/nanogpt-provider
              cp -r /workspace/* /opt/data/plugins/nanogpt-provider/
              hermes plugins enable nanogpt-provider
              hermes plugins list --plain --no-bundled
            '
