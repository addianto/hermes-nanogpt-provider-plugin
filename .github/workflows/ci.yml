---
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
    contents: read

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: "auto"
          prune-cache: "true"

      - name: Install dependencies
        run: uv sync --all-groups --inexact

      - name: Install Hermes Agent as dev dependency
        run: uv pip install -r requirements-dev.txt

      - name: Run Ruff check
        run: uv run ruff check

      - name: Run Ruff format check
        run: uv run ruff format --check

      - name: Run Pytest and measure coverage
        run: uv run pytest --cov=src --cov-report=term-missing

  integration-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        hermes-version: ["v0.22.2", "latest"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check if manual plugin installation works in Hermes Agent container
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD":/workspace:ro \
            docker.io/nousresearch/hermes-agent:${{ matrix.hermes-version }} \
            -c '
              set -euo pipefail
              mkdir -p /opt/data/plugins/nanogpt-provider
              cp -r /workspace/* /opt/data/plugins/nanogpt-provider/
              hermes plugins enable nanogpt-probider
              hermes plugins list
            '
