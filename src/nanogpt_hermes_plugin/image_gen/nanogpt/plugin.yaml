name: nanogpt
version: 0.1.0
description: "NanoGPT image generation backend. Text-to-image (implemented) and image-to-image (not yet implemented). Saves generated images to $HERMES_HOME/cache/images/."
author: Daya Adianto
kind: backend
requires_env:
  - name: NANOGPT_API_KEY
    description: "NanoGPT API key"
    url: https://nano-gpt.com/api
    secret: true